[package]
name = "azuti"
version = "0.1.0"
edition = "2021"
description = "A fast terminal (TUI) data viewer — queries land and line up like arrows in the azuchi (the archery target mound)"
license = "MIT"
repository = "https://github.com/foresta/azuti"
readme = "README.md"

[dependencies]
# TUI framework. We rely on the crossterm re-exported by ratatui
# (via `ratatui::crossterm`) instead of depending on crossterm directly,
# to avoid version mismatches.
ratatui = "0.30"
# CLI argument parsing.
clap = { version = "4", features = ["derive"] }
# Error handling + readable panic/error reports.
color-eyre = "0.6"
# Columnar in-memory data: holds result rows and formats cells for display.
# `csv` enables the CSV reader; the Parquet reader lives in the `parquet` crate.
# Pinned to 57 to match the Arrow version used by `snowflake-api`, so Snowflake
# result batches and our own RecordBatches are the same type.
arrow = { version = "57", features = ["csv"] }
parquet = { version = "57", features = ["arrow"] }
# Measure the terminal display width of strings (full-width CJK counts as 2),
# so column widths and truncation are correct for non-ASCII text.
unicode-width = "0.2"
# Snowflake connectivity (Arrow-native, pure Rust over HTTPS). Its Arrow version
# is why `arrow`/`parquet` above are pinned to 57.
snowflake-api = "0.14"
# Async runtime used to run the Snowflake query once at startup.
tokio = { version = "1", features = ["rt-multi-thread"] }
# Read Snowflake connection settings from connections.toml.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
